<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Traffic Animation - Transit Frequency Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="components.css">
  <style>
    /* ========================================
       ROAD TRAFFIC ANIMATION
       Two-way divided highway. Top carriageway
       drives left, bottom carriageway drives right.
       ======================================== */
    .road {
      position: relative;
      width: 100%;
      height: 420px;
      background-color: #44474d;
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.35);
    }

    /* Solid white edge lines (top & bottom of the road) */
    .road__edge {
      position: absolute;
      left: 0;
      right: 0;
      height: 6px;
      background: #f1f3f5;
    }
    .road__edge--top { top: 14px; }
    .road__edge--bottom { bottom: 14px; }

    /* Dashed white lane dividers within each carriageway */
    .road__lane-dash {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: repeating-linear-gradient(
        to right,
        #e9ecef 0 42px,
        transparent 42px 84px
      );
      opacity: 0.9;
    }
    .road__lane-dash--a { top: 30%; }
    .road__lane-dash--b { bottom: 30%; }

    /* Double yellow center line dividing the carriageways */
    .road__center {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 12px;
    }
    .road__center::before,
    .road__center::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: #f4c542;
    }
    .road__center::before { top: 0; }
    .road__center::after { bottom: 0; }

    /* Car wrapper — positioned per lane, animated across the road */
    .car {
      position: absolute;
      width: 150px;
      height: 66px;
      will-change: transform;
      filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.4));
    }
    .car svg { display: block; width: 100%; height: 100%; }

    /* Direction: leftbound cars are mirrored to face left */
    .car--left  { animation: drive-left linear infinite; }
    .car--right { animation: drive-right linear infinite; }
    .car--left svg { transform: scaleX(-1); }

    @keyframes drive-left {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-100vw - 320px)); }
    }
    @keyframes drive-right {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 320px)); }
    }

    /* Leftbound cars start off the right edge, drive to the left */
    .car--left  { right: -170px; }
    /* Rightbound cars start off the left edge, drive to the right */
    .car--right { left: -170px; }

    /* Lane positions (top of each car) */
    .lane-t1 { top: 9%; }
    .lane-t2 { top: 22%; }
    .lane-t3 { top: 35%; }
    .lane-b1 { top: 57%; }
    .lane-b2 { top: 70%; }
    .lane-b3 { top: 83%; }

    /* Per-car timing — varied speeds + negative delays so the road
       is already full of moving traffic on first paint. */
    .car.s-yellow { animation-duration: 7.5s;  animation-delay: -1.0s; }
    .car.s-white  { animation-duration: 9.0s;  animation-delay: -4.5s; }
    .car.s-purple { animation-duration: 6.2s;  animation-delay: -2.0s; }
    .car.s-blue   { animation-duration: 8.0s;  animation-delay: -0.5s; }
    .car.s-red    { animation-duration: 5.6s;  animation-delay: -3.0s; }
    .car.s-green  { animation-duration: 7.0s;  animation-delay: -5.0s; }

    /* Respect reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      .car { animation: none !important; }
    }

    .road.is-paused .car { animation-play-state: paused; }

    @media (max-width: 640px) {
      .road { height: 320px; }
      .car { width: 110px; height: 48px; }
    }
  </style>
</head>
<body>
  <div class="centered-layout">
    <div style="max-width: 1000px; width: 100%;">

      <!-- Header -->
      <div style="text-align: center; margin-bottom: var(--space-32);">
        <div style="width: 80px; height: 80px; background-color: var(--primary); border-radius: 16px; margin: 0 auto var(--space-24); display: flex; align-items: center; justify-content: center;">
          <i data-lucide="route" style="width: 48px; height: 48px; color: white;"></i>
        </div>
        <h1 class="text-display" style="margin-bottom: var(--space-16);">Road Traffic Animation</h1>
        <p class="text-body text-secondary" style="max-width: 640px; margin: 0 auto;">
          A two-way divided highway. The top carriageway flows left, the bottom carriageway flows
          right — six vehicles looping continuously with varied speeds.
        </p>
      </div>

      <!-- Animation card -->
      <div class="card mb-32">
        <div class="card-body">
          <div class="road" id="road">
            <div class="road__edge road__edge--top"></div>
            <div class="road__lane-dash road__lane-dash--a"></div>
            <div class="road__center"></div>
            <div class="road__lane-dash road__lane-dash--b"></div>
            <div class="road__edge road__edge--bottom"></div>

            <!-- ===== TOP CARRIAGEWAY — driving LEFT ===== -->
            <div class="car car--left s-yellow lane-t1"><svg viewBox="0 0 150 66"><use href="#car" style="color:#f5b21a"/></svg></div>
            <div class="car car--left s-white lane-t2"><svg viewBox="0 0 150 66"><use href="#car" style="color:#e6e8ea"/></svg></div>
            <div class="car car--left s-purple lane-t3"><svg viewBox="0 0 150 66"><use href="#car" style="color:#9b4dd4"/></svg></div>

            <!-- ===== BOTTOM CARRIAGEWAY — driving RIGHT ===== -->
            <div class="car car--right s-blue lane-b1"><svg viewBox="0 0 150 66"><use href="#car" style="color:#2f6df0"/></svg></div>
            <div class="car car--right s-red lane-b2"><svg viewBox="0 0 150 66"><use href="#car" style="color:#e2483a"/></svg></div>
            <div class="car car--right s-green lane-b3"><svg viewBox="0 0 150 66"><use href="#car" style="color:#16b88a"/></svg></div>
          </div>

          <div class="flex items-center justify-between mt-16">
            <p class="text-small text-secondary">6 vehicles • seamless loop • GPU-accelerated transforms</p>
            <button class="btn btn-secondary" id="toggleBtn" type="button">Pause</button>
          </div>
        </div>
      </div>

      <div style="text-align: center;">
        <a href="index.html" class="btn btn-secondary">
          <i data-lucide="arrow-left" style="width:16px;height:16px;display:inline;vertical-align:middle;margin-right:6px;"></i>
          Back to Home
        </a>
      </div>

    </div>
  </div>

  <!-- Reusable top-view car (drawn pointing RIGHT; mirrored for leftbound) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="car" viewBox="0 0 150 66">
      <!-- body -->
      <rect x="6" y="7" width="138" height="52" rx="22" fill="currentColor"/>
      <!-- top sheen + lower shade for a little volume -->
      <rect x="12" y="9" width="126" height="9" rx="14" fill="#ffffff" opacity="0.16"/>
      <rect x="12" y="48" width="126" height="9" rx="14" fill="#000000" opacity="0.14"/>
      <!-- cabin glass -->
      <rect x="38" y="14" width="74" height="38" rx="14" fill="#23262d"/>
      <!-- rear & front windshields -->
      <rect x="42" y="18" width="16" height="30" rx="6" fill="#2f3946"/>
      <rect x="92" y="18" width="16" height="30" rx="6" fill="#3c4b5c"/>
      <!-- body-colour roof bar across the glass -->
      <rect x="66" y="14" width="18" height="38" fill="currentColor"/>
      <!-- side mirrors -->
      <rect x="86" y="3" width="12" height="6" rx="2" fill="currentColor"/>
      <rect x="86" y="57" width="12" height="6" rx="2" fill="currentColor"/>
      <!-- headlights (front / right) -->
      <rect x="138" y="13" width="6" height="9" rx="2" fill="#fff7d6"/>
      <rect x="138" y="44" width="6" height="9" rx="2" fill="#fff7d6"/>
      <!-- taillights (rear / left) -->
      <rect x="6" y="13" width="5" height="9" rx="2" fill="#e0352a"/>
      <rect x="6" y="44" width="5" height="9" rx="2" fill="#e0352a"/>
    </symbol>
  </svg>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();
    const road = document.getElementById('road');
    const btn = document.getElementById('toggleBtn');
    btn.addEventListener('click', () => {
      const paused = road.classList.toggle('is-paused');
      btn.textContent = paused ? 'Play' : 'Pause';
    });
  </script>
</body>
</html>
