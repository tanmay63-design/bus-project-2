<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Transit Frequency Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>
  <div class="centered-layout">
    <div class="auth-card" style="max-width: 900px; padding: 0; display: flex; min-height: 600px;">

      <!-- Left Side - Form -->
      <div style="flex: 1; padding: var(--space-32);">
        <!-- Tabs -->
        <div class="tabs" style="margin-bottom: var(--space-24);">
          <button class="tab" onclick="window.location.href='auth-signup.html'">Sign Up</button>
          <button class="tab active">Log In</button>
        </div>

        <!-- Login Form -->
        <form>
          <div class="form-group" style="margin-bottom: var(--space-12);">
            <label class="form-label" for="email">Email address</label>
            <input
              type="email"
              id="email"
              class="input"
              placeholder="you@organization.com"
              required
            />
          </div>

          <div class="form-group" style="margin-bottom: var(--space-8);">
            <label class="form-label" for="password">Password</label>
            <input
              type="password"
              id="password"
              class="input"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="form-group" style="margin-bottom: var(--space-16);">
            <a href="#" class="text-small" style="color: var(--primary); text-decoration: none;">
              Forgot password?
            </a>
          </div>

          <button type="submit" class="btn btn-primary w-full">
            Log In
          </button>

          <!-- Divider -->
          <div style="position: relative; text-align: center; margin: var(--space-16) 0;">
            <hr class="divider" style="margin: 0;">
            <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--surface-card); padding: 0 var(--space-12); color: var(--text-tertiary); font-size: var(--font-small);">
              or
            </span>
          </div>

          <button type="button" class="btn btn-secondary w-full">
            Continue with SSO
          </button>

          <p class="text-small text-center" style="margin-top: var(--space-16); color: var(--text-tertiary);">
            By logging in, you agree to our Terms of Service and Privacy Policy
          </p>
        </form>
      </div>

      <!-- Right Side - Branding -->
      <div style="flex: 1; background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%); border-radius: 0 var(--radius-modal) var(--radius-modal) 0; padding: var(--space-32); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white;">
        <div style="width: 64px; height: 64px; background-color: rgba(255, 255, 255, 0.2); border-radius: 12px; margin-bottom: var(--space-16); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px);">
          <i data-lucide="bus" style="width: 32px; height: 32px; color: white;"></i>
        </div>
        <h1 style="font-size: 28px; font-weight: 600; margin-bottom: var(--space-12); line-height: 1.2;">Transit Frequency Console</h1>
        <p style="font-size: 16px; opacity: 0.9; max-width: 300px;">Manage bus operations for your city with ease and efficiency</p>
      </div>

    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
